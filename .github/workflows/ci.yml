name: Demo validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  application-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tests/portal-browser/package-lock.json
      - name: Install locked browser tooling
        run: |
          npm ci --prefix tests/portal-browser
          cd tests/portal-browser
          npx playwright install --with-deps chromium
      - name: Test actual application pages without cloud credentials
        run: |
          npm --prefix tests/portal-browser run test:contracts
          npm --prefix tests/portal-browser run test:local
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          check_together: "yes"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive terraform
      - name: Validate Terraform roots
        run: |
          for root in terraform/shared terraform/dc1 terraform/dc2; do
            terraform -chdir="$root" init -backend=false -input=false
            terraform -chdir="$root" validate
          done
      - name: Test demo application
        run: |
          pip install -r tests/requirements.txt
          python -m pytest tests/test_application.py -v
      - name: Test Terraform environment configuration
        run: bash tests/test-terraform-env.sh
      - name: Test local SSH key lifecycle
        run: bash tests/test-ssh-key.sh
      - name: Test HCP workspace initialization
        run: bash tests/test-workspace.sh
      - name: Test runtime CLI configuration
        run: bash tests/test-runtime-env.sh
      - name: Install Ansible validation tools
        run: |
          pip install -r bootstrap/requirements.txt ansible-lint yamllint
          ansible-galaxy collection install -r bootstrap/requirements.yml
          ansible-galaxy collection install -r bootstrap/aap-requirements.yml --no-deps
      - name: Validate AAP configuration and expose certified module schemas
        run: |
          bash tests/test-aap-config.sh
          bash tests/test-portal-config.sh
          mkdir -p .local/aap-collections/ansible_collections
          container=$(docker create ww-demo-aap-ee:phase4 /bin/true)
          docker cp "$container:/usr/share/ansible/collections/ansible_collections/ansible" .local/aap-collections/ansible_collections/
          docker cp "$container:/usr/share/ansible/collections/ansible_collections/kubernetes" .local/aap-collections/ansible_collections/
          docker rm "$container"
      - name: Test lifecycle approval, saved-plan and ownership guards
        run: bash tests/test-lifecycle.sh
      - name: Test administrator failure-simulation guards without AWS credentials
        run: bash tests/test-demo-simulation.sh
      - name: Test read-only presenter readiness and concise reports
        run: bash tests/test-demo-status.sh
      - name: Lint Ansible runtime automation
        run: |
          export ANSIBLE_COLLECTIONS_PATH="$PWD/.local/aap-collections:$HOME/.ansible/collections"
          ansible-lint playbooks/runtime-failover.yml playbooks/terraform-discover.yml playbooks/terraform-workspace.yml playbooks/aap/stage.yml playbooks/aap/readiness.yml roles bootstrap/check-aap.yml bootstrap/install-demo.yml bootstrap/setup-demo.yml bootstrap/build-ee.yml bootstrap/check-runtime.yml bootstrap/run-workflow.yml bootstrap/inspect-aap.yml bootstrap/inspect-openshift.yml tests/terraform_api/operation.yml tests/runtime/workflow-stage.yml
          yamllint -d '{extends: default, rules: {line-length: disable}}' bootstrap playbooks roles tests/terraform_api/operation.yml tests/runtime/workflow-stage.yml
          ansible-lint bootstrap/portal/check.yml bootstrap/portal/deploy.yml bootstrap/portal/verify.yml playbooks/aap/portal-launch.yml tests/portal
          yamllint -d '{extends: default, rules: {line-length: disable}}' portal tests/portal
          ansible-lint bootstrap/bootstrap.yml bootstrap/teardown.yml bootstrap/lifecycle-platform.yml bootstrap/lifecycle-cleanup.yml bootstrap/lifecycle tests/lifecycle profiles playbooks/demo tests/demo bootstrap/demo-status.yml bootstrap/status tests/status
          yamllint -d '{extends: default, rules: {line-length: disable}}' profiles tests/lifecycle tests/demo tests/status
      - name: Test Terraform API integration without cloud credentials
        run: bash tests/test-terraform-api.sh
      - name: Test runtime failover and failure handling without cloud credentials
        run: bash tests/test-runtime.sh
