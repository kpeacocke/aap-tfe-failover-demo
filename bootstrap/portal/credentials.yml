---
- name: Inspect previously persisted demo Portal credentials
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ demo_portal_namespace }}"
    name: ww-demo-portal-identities
  register: demo_portal_identity_secret
  no_log: true

- name: Reuse or generate passwords only in memory
  ansible.builtin.set_fact:
    demo_portal_catalog_password: >-
      {{ demo_portal_identity_secret.resources[0].data['catalog-password'] | b64decode
         if demo_portal_identity_secret.resources | length else lookup('ansible.builtin.password', '/dev/null', length=48) }}
    demo_portal_runner_password: >-
      {{ demo_portal_identity_secret.resources[0].data['runner-password'] | b64decode
         if demo_portal_identity_secret.resources | length else lookup('ansible.builtin.password', '/dev/null', length=48) }}
  no_log: true

- name: Persist generated passwords before any external side effect
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ww-demo-portal-identities
        namespace: "{{ demo_portal_namespace }}"
        labels: "{{ demo_portal_labels }}"
      type: Opaque
      data:
        catalog-password: "{{ demo_portal_catalog_password | b64encode }}"
        runner-password: "{{ demo_portal_runner_password | b64encode }}"
  no_log: true

- name: Declare only demo Portal identities and OAuth application
  ansible.builtin.include_vars: aap-vars.yml

- name: Inspect existing Portal connection Secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ demo_portal_namespace }}"
    name: secrets-rhaap-portal
  register: demo_portal_connection_secret
  no_log: true

- name: Reconcile Gateway OAuth before unrelated identity configuration
  ansible.builtin.include_role:
    name: infra.aap_configuration.dispatch
  vars:
    aap_configuration_dispatcher_roles:
      - role: gateway_applications
        var: aap_applications
        tags: [applications, gateway_applications]

- name: Capture the certified synchronous action result when no async job was returned
  ansible.builtin.set_fact:
    demo_portal_oauth: "{{ __gateway_applications_job_async.results[0] }}"
  when: demo_portal_oauth is not defined
  no_log: true

- name: Require recoverable OAuth credentials without replacing an existing client
  ansible.builtin.assert:
    that:
      - demo_portal_connection_secret.resources | length > 0 or demo_portal_oauth.client_secret | default('') | length > 0
      - demo_portal_connection_secret.resources | length > 0 or demo_portal_oauth.client_secret | default('') != '$encrypted$'
    fail_msg: >-
      OAuth client already exists but its original Secret is unavailable. Restore the demo Secret or explicitly rotate the demo OAuth client;
      bootstrap will not silently replace a client or lose credentials.
  no_log: true

- name: Persist the one-time OAuth credentials before any further AAP mutation
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: secrets-rhaap-portal
        namespace: "{{ demo_portal_namespace }}"
        labels: "{{ demo_portal_labels }}"
      type: Opaque
      data:
        aap-host-url: "{{ aap_hostname | b64encode }}"
        oauth-client-id: "{{ demo_portal_oauth.client_id | b64encode }}"
        oauth-client-secret: "{{ demo_portal_oauth.client_secret | b64encode }}"
  when: demo_portal_connection_secret.resources | length == 0
  no_log: true

- name: Reconcile supported demo identities and grants through declarative dispatch
  ansible.builtin.include_role:
    name: infra.aap_configuration.dispatch
  vars:
    aap_configuration_dispatcher_exclude_roles: [controller_applications, gateway_applications]

- name: Record whether the catalog token was already persisted
  ansible.builtin.set_fact:
    demo_portal_catalog_token_exists: >-
      {{ demo_portal_connection_secret.resources | length > 0 and
         demo_portal_connection_secret.resources[0].data.get('aap-token', '') | length > 0 }}
  no_log: true

- name: Create a read-scoped token only when no catalog token is persisted
  ansible.platform.token:
    description: Demo-managed Portal catalog synchronization; demo organization only.
    scope: [read]
    aap_hostname: "{{ aap_hostname }}"
    aap_username: ww-demo-portal-catalog
    aap_password: "{{ demo_portal_catalog_password }}"
    aap_token: ""
    aap_validate_certs: "{{ aap_validate_certs }}"
  register: demo_portal_catalog_token
  when: not demo_portal_catalog_token_exists
  no_log: true

- name: Persist the supported Portal connection Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: secrets-rhaap-portal
        namespace: "{{ demo_portal_namespace }}"
        labels: "{{ demo_portal_labels }}"
      type: Opaque
      data:
        aap-host-url: "{{ aap_hostname | b64encode }}"
        oauth-client-id: >-
          {{ demo_portal_connection_secret.resources[0].data['oauth-client-id']
             if demo_portal_connection_secret.resources | length else demo_portal_oauth.client_id | b64encode }}
        oauth-client-secret: >-
          {{ demo_portal_connection_secret.resources[0].data['oauth-client-secret']
             if demo_portal_connection_secret.resources | length else demo_portal_oauth.client_secret | b64encode }}
        aap-token: >-
          {{ demo_portal_connection_secret.resources[0].data['aap-token']
             if demo_portal_catalog_token_exists else demo_portal_catalog_token.ansible_facts.aap_token.token | b64encode }}
  no_log: true

- name: Inspect persisted workflow-runner token
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ demo_portal_namespace }}"
    name: ww-demo-portal-runner
  register: demo_portal_runner_secret
  no_log: true

- name: Create the execute-only workflow runner token once
  ansible.platform.token:
    description: Demo-managed Portal bridge; execute only approved workflows.
    scope: [write]
    aap_hostname: "{{ aap_hostname }}"
    aap_username: ww-demo-portal-runner
    aap_password: "{{ demo_portal_runner_password }}"
    aap_token: ""
    aap_validate_certs: "{{ aap_validate_certs }}"
  register: demo_portal_runner_token
  when: demo_portal_runner_secret.resources | length == 0
  no_log: true

- name: Persist only the demo execute-only runner token
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: ww-demo-portal-runner
        namespace: "{{ demo_portal_namespace }}"
        labels: "{{ demo_portal_labels }}"
      type: Opaque
      data:
        token: >-
          {{ demo_portal_runner_secret.resources[0].data.token
             if demo_portal_runner_secret.resources | length else demo_portal_runner_token.ansible_facts.aap_token.token | b64encode }}
  no_log: true

- name: Restore administrator authentication after the token module publishes its aap_token fact
  ansible.builtin.set_fact:
    aap_token: "{{ lookup('ansible.builtin.env', 'AAP_TOKEN') }}"
  no_log: true

- name: Read only the existing RHDP registry credential approved for reuse
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: openshift-config
    name: pull-secret
  register: demo_portal_registry_source
  no_log: true
  when: lookup('ansible.builtin.env', 'DEMO_PORTAL_REUSE_CLUSTER_REGISTRY_AUTH') | bool

- name: Require explicit permission to reuse the cluster registry credential
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'DEMO_PORTAL_REUSE_CLUSTER_REGISTRY_AUTH') | bool
    fail_msg: >-
      Portal requires registry.redhat.io authentication. Set DEMO_PORTAL_REUSE_CLUSTER_REGISTRY_AUTH=true only after approving
      the copy of that single registry entry into the demo namespace. No registry credentials have been copied.

- name: Require the approved Red Hat registry entry
  ansible.builtin.assert:
    that:
      - >-
        'registry.redhat.io' in
        (demo_portal_registry_source.resources[0].data['.dockerconfigjson'] | b64decode | from_json).auths
    fail_msg: RHDP has no registry.redhat.io credential. Supply a registry service account; do not use anonymous pulls or a different registry.
  no_log: true

- name: Copy only the approved registry entry to the documented OCI Secret
  kubernetes.core.k8s:
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ demo_portal_release }}-dynamic-plugins-registry-auth"
        namespace: "{{ demo_portal_namespace }}"
        labels: "{{ demo_portal_labels }}"
      type: Opaque
      data:
        auth.json: >-
          {{ {'auths': {'registry.redhat.io':
             (demo_portal_registry_source.resources[0].data['.dockerconfigjson'] | b64decode | from_json).auths['registry.redhat.io']}}
             | to_json | b64encode }}
  no_log: true
