---
- name: Discover demo Terraform workspaces and prepare CLI runtime inventory
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  tasks:
    - name: Discover workspaces and current infrastructure outputs
      ansible.builtin.include_role:
        name: terraform_workspace
        public: true

    - name: Validate the front-door infrastructure outputs
      ansible.builtin.assert:
        that:
          - terraform_workspace_outputs.shared.frontdoor_public_ip.value is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
          - >-
            terraform_workspace_outputs.shared.frontdoor_url.value ==
            'http://' ~ terraform_workspace_outputs.shared.frontdoor_public_ip.value
        fail_msg: Missing or invalid shared front-door outputs. Apply the shared root before runtime operations.

    - name: Validate datacentre output shapes
      ansible.builtin.assert:
        that:
          - terraform_workspace_outputs[item].datacentre_name.value == item
          - terraform_workspace_outputs[item].application_private_ips.value is sequence
          - terraform_workspace_outputs[item].application_private_ips.value is not string
          - terraform_workspace_outputs[item].application_private_ips.value | length == 2
          - terraform_workspace_outputs[item].application_private_ips.value | unique | length == 2
          - terraform_workspace_outputs[item].application_instance_ids.value | length == 2
          - terraform_workspace_outputs[item].health_urls.value | length == 2
        fail_msg: "Invalid {{ item }} outputs. Both demo nodes must be provisioned before runtime operations."
      loop: [dc1, dc2]

    - name: Validate each node address and health URL
      ansible.builtin.assert:
        that:
          - terraform_workspace_outputs[item.0].application_private_ips.value[item.1] is match('^([0-9]{1,3}\.){3}[0-9]{1,3}$')
          - terraform_workspace_outputs[item.0].application_instance_ids.value[item.1] is match('^i-[a-f0-9]+$')
          - >-
            terraform_workspace_outputs[item.0].health_urls.value[item.1] ==
            'http://' ~ terraform_workspace_outputs[item.0].application_private_ips.value[item.1] ~ ':8080/health'
        fail_msg: "Unexpected address, instance ID or health URL for {{ item.0 }} node {{ item.1 + 1 }}."
      loop: "{{ ['dc1', 'dc2'] | product([0, 1]) | list }}"

    - name: Require a private inventory destination
      ansible.builtin.assert:
        that:
          - terraform_workspace_inventory_path | default('') is match('^/')
          - runtime_ssh_private_key_path | default('') is match('^/')
        fail_msg: Supply absolute temporary inventory and private key paths through the CLI wrapper.

    - name: Write the Terraform-derived runtime inventory without credentials
      ansible.builtin.template:
        src: templates/runtime-inventory.json.j2
        dest: "{{ terraform_workspace_inventory_path }}"
        mode: "0600"
