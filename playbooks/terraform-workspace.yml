---
- name: Safely quarantine or release a demo Terraform workspace
  hosts: haproxy
  gather_facts: false
  become: true
  vars:
    runtime_operation_marker: /run/ww-demo-failover.lock
    runtime_target_dc: "{{ 'dc2' if workspace_cli_dc == 'dc1' else 'dc1' }}"
    runtime_source_dc: "{{ workspace_cli_dc }}"
    runtime_health_retries: 10
    runtime_health_delay_seconds: 3
    runtime_validation_samples: 8
    runtime_application_version: "1.0.0"
  pre_tasks:
    - name: Validate workspace administrative request
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
          - ansible_play_hosts_all | length == 1
          - workspace_cli_action | default('') in ['lock', 'unlock']
          - workspace_cli_dc | default('') in ['dc1', 'dc2']
          - workspace_cli_reference | default('') is match('^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$')
        fail_msg: Supply lock/unlock, one of dc1/dc2 and the original incident/change reference.

    - name: Acquire the same marker used by runtime failover
      ansible.builtin.command:
        argv: [mkdir, "{{ runtime_operation_marker }}"]
      changed_when: true

  tasks:
    - name: Execute a guarded workspace operation
      block:
        - name: Record the workspace marker owner for interruption diagnostics
          ansible.builtin.copy:
            dest: "{{ runtime_operation_marker }}/request.json"
            mode: "0600"
            content: >-
              {{ {'reference': workspace_cli_reference, 'datacentre': workspace_cli_dc,
                  'action': workspace_cli_action, 'started_at': now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ')} | to_nice_json }}

        - name: Validate the recovered datacentre before releasing quarantine
          ansible.builtin.include_role:
            name: application_health
          vars:
            application_health_dc: "{{ workspace_cli_dc }}"
            application_health_nodes: "{{ runtime_sites[workspace_cli_dc] }}"
            application_health_required: true
          when: workspace_cli_action == 'unlock'

        - name: Require recovered site standby and validate the still-active service
          ansible.builtin.include_role:
            name: synthetic_validation
          when: workspace_cli_action == 'unlock'

        - name: Perform the verified workspace operation on the CLI controller only
          ansible.builtin.include_role:
            name: terraform_workspace
            tasks_from: operation
            apply:
              delegate_to: localhost
              become: false
              vars:
                ansible_python_interpreter: "{{ ansible_playbook_python }}"
          vars:
            terraform_workspace_dc: "{{ workspace_cli_dc }}"
            terraform_workspace_reference: "{{ workspace_cli_reference }}"
            terraform_workspace_action: "{{ workspace_cli_action }}"

        - name: Publish the workspace operation result
          ansible.builtin.set_stats:
            data:
              terraform_workspace_operation: "{{ terraform_workspace_result }}"
      always:
        - name: Release this operation's marker
          ansible.builtin.file:
            path: "{{ runtime_operation_marker }}"
            state: absent
