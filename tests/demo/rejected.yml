---
- name: Require rejection of the unsafe fixture
  block:
    - name: Execute production guards with the unsafe fixture overrides
      ansible.builtin.include_tasks:
        file: "{{ simulation_fixture.path }}"
        apply:
          vars: "{{ simulation_case.overrides }}"

    - name: Fail if an unsafe fixture passed
      ansible.builtin.fail:
        msg: "TEST FAILURE - accepted {{ simulation_case.name }}."
  rescue:
    - name: Require rejection by a production assertion rather than the fixture sentinel
      ansible.builtin.assert:
        that:
          - ansible_failed_task.name != 'Fail if an unsafe fixture passed'
          - "'ansible.builtin.assert' in ansible_failed_task.action"
