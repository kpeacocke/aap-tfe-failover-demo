---
- name: Exercise production credential-result handling without platform credentials
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    demo_portal_test_credentials: "{{ lookup('ansible.builtin.file', '../../bootstrap/portal/credentials.yml') | from_yaml }}"
    demo_portal_test_selected:
      - Capture the certified synchronous action result when no async job was returned
      - Record whether the catalog token was already persisted
  tasks:
    - name: Exercise synchronous results and interrupted installation recovery
      block:
        - name: Allocate a temporary task fixture
          ansible.builtin.tempfile:
            state: file
            suffix: -portal-credentials.yml
          register: demo_portal_test_task_file

        - name: Select the actual production tasks rather than duplicating expressions
          ansible.builtin.copy:
            dest: "{{ demo_portal_test_task_file.path }}"
            content: "{{ demo_portal_test_credentials | selectattr('name', 'in', demo_portal_test_selected) | list | to_nice_yaml }}"
            mode: "0600"

        - name: Model the certified synchronous creation result and an absent connection Secret
          ansible.builtin.set_fact:
            __gateway_applications_job_async:
              results: [{client_id: fixture-id, client_secret: fixture-secret}]
            demo_portal_connection_secret: {resources: []}

        - name: Execute production handling for a new installation
          ansible.builtin.include_tasks: "{{ demo_portal_test_task_file.path }}"

        - name: Require capture of the one-time creation response
          ansible.builtin.assert:
            that:
              - demo_portal_oauth.client_id == 'fixture-id'
              - demo_portal_oauth.client_secret == 'fixture-secret'
              - not demo_portal_catalog_token_exists

        - name: Model an existing async registration and an interrupted partial Secret
          ansible.builtin.set_fact:
            demo_portal_oauth: {client_id: registered-id, client_secret: registered-secret}
            demo_portal_connection_secret:
              resources: [{data: {oauth-client-id: fixture-id, oauth-client-secret: fixture-secret}}]

        - name: Execute production handling for an interrupted installation
          ansible.builtin.include_tasks: "{{ demo_portal_test_task_file.path }}"

        - name: Require preservation of registered results and creation of only the missing token
          ansible.builtin.assert:
            that:
              - demo_portal_oauth.client_id == 'registered-id'
              - not demo_portal_catalog_token_exists

        - name: Model an already persisted catalog token
          ansible.builtin.set_fact:
            demo_portal_connection_secret:
              resources: [{data: {aap-token: fixture-token}}]

        - name: Execute production handling for a repeat installation
          ansible.builtin.include_tasks: "{{ demo_portal_test_task_file.path }}"

        - name: Require token reuse and immediate OAuth persistence
          ansible.builtin.assert:
            that:
              - demo_portal_catalog_token_exists
              - >-
                (demo_portal_test_credentials | map(attribute='name') | list).index(
                  'Persist the one-time OAuth credentials before any further AAP mutation') <
                (demo_portal_test_credentials | map(attribute='name') | list).index(
                  'Reconcile supported demo identities and grants through declarative dispatch')
      always:
        - name: Remove only the temporary fixture file
          ansible.builtin.file:
            path: "{{ demo_portal_test_task_file.path }}"
            state: absent
          when: demo_portal_test_task_file.path is defined
