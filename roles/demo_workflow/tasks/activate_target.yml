---
- name: Recheck every target node after the isolated drain job
  ansible.builtin.include_role:
    name: application_health
  vars:
    application_health_dc: "{{ runtime_target_dc }}"
    application_health_nodes: "{{ runtime_sites[runtime_target_dc] }}"
    application_health_required: true

- name: Activate the target without restarting HAProxy
  ansible.builtin.include_role:
    name: haproxy_state
    tasks_from: activate
